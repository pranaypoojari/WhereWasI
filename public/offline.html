<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Offline | WhereWasI</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: radial-gradient(ellipse at top right, #3f0d1c 0%, #0b0f17 55%);
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      }
      h1 { margin: 12px 0 8px; font-size: 22px; color: #fff; }
      p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #94a3b8; }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font: 700 11px ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em;
        color: #fda4af;
        background: rgba(244, 63, 94, 0.12);
        border: 1px solid rgba(244, 63, 94, 0.35);
      }
      ul { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px; }
      a.item {
        display: block;
        padding: 10px 14px;
        border-radius: 12px;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }
      a.item:hover { border-color: rgba(244, 63, 94, 0.6); }
      a.item small { display: block; font-weight: 400; color: #64748b; font-size: 12px; margin-top: 2px; }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 14px;
        background: #f43f5e;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">OFFLINE</span>
      <h1>You're offline</h1>
      <p>New recaps need a connection, but anything you opened before is saved on this device.</p>
      <ul id="saved" aria-label="Saved recaps and story-books"></ul>
      <p id="empty">Nothing saved yet. Open a show while online and it will be available here next time.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      (function () {
        var list = document.getElementById('saved');
        var empty = document.getElementById('empty');
        function label(url) {
          var slug = url.pathname.replace(/^\//, '').split('/')[0] || 'home';
          var name = slug.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
          var s = url.searchParams.get('s') || url.searchParams.get('season');
          var e = url.searchParams.get('e') || url.searchParams.get('episode');
          var mode = url.searchParams.get('mode');
          var title = url.searchParams.get('title');
          if (slug === 'generate' && title) name = title;
          var detail = mode === 'book' || mode === 'storybook' ? 'Story-Book' : s && e ? 'Recap up to S' + s + 'E' + e : 'Recap';
          return { name: name, detail: detail };
        }
        if (!('caches' in window)) { empty.style.display = 'block'; return; }
        caches.open('wherewasi-v1-pages').then(function (cache) {
          return cache.keys();
        }).then(function (requests) {
          var seen = {};
          var items = requests
            .map(function (r) { return new URL(r.url); })
            .filter(function (u) { return u.pathname !== '/offline.html' && !seen[u.href] && (seen[u.href] = true); })
            .reverse();
          if (items.length === 0) { empty.style.display = 'block'; return; }
          items.slice(0, 20).forEach(function (u) {
            var info = label(u);
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.className = 'item';
            a.href = u.pathname + u.search;
            a.textContent = info.name;
            var small = document.createElement('small');
            small.textContent = info.detail;
            a.appendChild(small);
            li.appendChild(a);
            list.appendChild(li);
          });
        }).catch(function () { empty.style.display = 'block'; });
      })();
    </script>
  </body>
</html>
